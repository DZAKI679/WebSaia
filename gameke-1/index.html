<!DOCTYPE html>
<html>
<head>
    <title>Game Pertama</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Game Kotak</h1>
    <p>Gunakan tombol panah untuk bergerak</p>

    <canvas id="game" width="500" height="500"></canvas>




    <section class="buttonArea">
        <button class="buttonArrow" id="up"   >⬆️</button>
        <button class="buttonArrow" id="down" >⬇️</button>
        <button class="buttonArrow" id="left" >⬅️</button>
        <button class="buttonArrow" id="right">➡️</button>
    </section>

    <script src="game.js"></script>

</body>
</html>
